# v8-core, stage 2 (Changes 1+2): x0-prediction + decoded-space CE.
#
# 1-epoch PLUMBING smoke for Change 2: does the in-training VAE decode fit
# in memory, does train/semantic_ce appear and move. Runs in parallel with
# the stage-1 validation (independent checks).
#
# Change 2: at timesteps with sigma <= semantic_ce_sigma_max, the predicted
# clean semantic latent (prefix of semantic_ce_latent_frames latent frames) is
# VAE-decoded to full resolution and a small trainable conv head
# (semantic_class_head, in trainable_models below) produces per-pixel class
# logits, scored with cross-entropy against the GT class map. The loss finally
# asks "is this pixel the right class?" at the pixel scale where speckle lives.
#
# EVAL: same as stage 1 (--semantic_x0_prediction) — checkpoints additionally
# carry semantic_class_head.* keys; inference auto-instantiates the head.

height: 336
width: 560
num_views: 81
min_num_context_views: 11
max_num_context_views: 21
seed: 0

semantic_channels: 16
semantic_expansion_version: 2
semantic_x0_prediction: true

# --- Change 2 ---
semantic_ce_weight: 0.1        # start ~0.1x the diffusion loss; tune by val mIoU
semantic_ce_sigma_max: 0.7
semantic_ce_latent_frames: 2   # -> 5 decoded video frames per CE step
num_semantic_classes: 30       # UPDATE alongside the class-set decision

semantic_loss_weight: 2.0

distill_lora_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors
distill_lora_alpha: 1.0

train_dataset: SpatialVID(split=None, ROOT="/scratch/m000204-pm06b/joana/combined_train_data", labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam3_labels", target_labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/rugd_gt_labels", max_interval=5, height=${height}, width=${width}, num_views=${num_views}, min_num_context_views=${min_num_context_views}, max_num_context_views=${max_num_context_views}, seed=${seed})

model_path: /scratch/m000204-pm06b/joana/NeoVerse/models
reconstructor_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/reconstructor.ckpt

pipeline_kwargs:
  novel_view_sampling_trans: [0.01, 0.1]
  novel_view_sampling_max_rot: 0.0
  culling_prob: 0.3
  kernel_size_range: [11, 51]
  occlusion_thresh: 0.1
  alpha_thresh: 0.5
  color_thresh: [50, 100]
  prompt_drop_prob: 0.1
  mask_drop_prob: 0.2
  condition_drop_prob: 0.05

# semantic_class_head added: the CE head trains alongside the _sem submodules.
trainable_models: "dit.patch_embedding.sem,dit.head.head.sem,control_branch.control_patch_embedding.sem,semantic_class_head"

lora_base_model: dit
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_exclude_modules: null
lora_rank: 8

pretrained_path: null

learning_rate: 1e-4
num_epochs: 1
batch_size: 1
num_workers: 2
pin_memory: false
gradient_accumulation_steps: 1
output_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v8_stage2_smoke
remove_prefix_in_ckpt: pipe.

use_gradient_checkpointing: true
use_gradient_checkpointing_offload: true
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0

print_freq: 5
save_freq: 0.5
clip_grad: 1.0
resume: null
start_epoch: 0
resume_step: null

wandb_project: neoverse-semantic
wandb_run_name: v8_stage2_smoke
wandb_mode: online

debug_save_root: null
