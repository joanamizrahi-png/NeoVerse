# v8 stage-1 VALIDATION: 5 epochs (~3.5-4 h). The 1-epoch smoke proved the
# objective TRAINS (44 steps, no NaN, ckpts saved); 44 steps was too few to
# read a loss trend through per-step timestep noise. ~220 steps + smoothing
# is enough. Read: smoothed train/semantic_loss slope + epoch-5 inference.
#
# Purpose: verify the x0-prediction objective TRAINS before committing to the
# 30-epoch run. Pass criteria:
#   1. train/semantic_loss visibly drops within the first ~20-50 steps.
#      NOTE: the sem-loss SCALE is not comparable to v6/v7 curves — the
#      objective changed (clean-latent MSE vs velocity MSE). Judge the TREND,
#      not the value.
#   2. rgb loss behaves like v7's early steps (RGB path untouched -> unchanged).
#   3. inference on an early checkpoint WITH --semantic_x0_prediction shows
#      recognizable class regions (rough is fine; noise is a fail).
# Identical to train_semantic_v8.yaml except: num_epochs 5, save per epoch,
# separate output/wandb names.

height: 336
width: 560
num_views: 81
min_num_context_views: 11
max_num_context_views: 21
seed: 0

semantic_channels: 16
semantic_expansion_version: 2
semantic_x0_prediction: true

semantic_loss_weight: 2.0

distill_lora_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors
distill_lora_alpha: 1.0

train_dataset: SpatialVID(split=None, ROOT="/scratch/m000204-pm06b/joana/combined_train_data", labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam3_labels", target_labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/rugd_gt_labels", max_interval=5, height=${height}, width=${width}, num_views=${num_views}, min_num_context_views=${min_num_context_views}, max_num_context_views=${max_num_context_views}, seed=${seed})

model_path: /scratch/m000204-pm06b/joana/NeoVerse/models
reconstructor_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/reconstructor.ckpt

pipeline_kwargs:
  novel_view_sampling_trans: [0.01, 0.1]
  novel_view_sampling_max_rot: 0.0
  culling_prob: 0.3
  kernel_size_range: [11, 51]
  occlusion_thresh: 0.1
  alpha_thresh: 0.5
  color_thresh: [50, 100]
  prompt_drop_prob: 0.1
  mask_drop_prob: 0.2
  condition_drop_prob: 0.05

trainable_models: "dit.patch_embedding.sem,dit.head.head.sem,control_branch.control_patch_embedding.sem"

lora_base_model: dit
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_exclude_modules: null
lora_rank: 8

pretrained_path: null

learning_rate: 1e-4
num_epochs: 5
batch_size: 1
num_workers: 2
pin_memory: false
gradient_accumulation_steps: 1
output_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v8_val5
remove_prefix_in_ckpt: pipe.

use_gradient_checkpointing: true
use_gradient_checkpointing_offload: true
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0

print_freq: 5
save_freq: 1.0
clip_grad: 1.0
resume: null
start_epoch: 0
resume_step: null

wandb_project: neoverse-semantic
wandb_run_name: v8_val5_x0
wandb_mode: online

debug_save_root: null
