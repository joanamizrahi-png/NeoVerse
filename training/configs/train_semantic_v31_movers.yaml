# v31_movers (2026-09-07): v30_static's exact recipe (v26_campus recipe, warm
# from v26 e10, 6 epochs, STATIC conditioning) plus STATIC MOVERS: Gaussians
# labelled person (12) or vehicle (13) stay per-frame instead of being fused
# into the constant set. Why: in static conditioning a walker becomes a trail
# smeared over every view while the target shows them once; the worst SANPO
# clip is 42% person pixels, and v30 at half an epoch painted "person" over
# 0.37 of the near ground on pedestrian-free campus renders (0.14 for v26).

height: 336
width: 560
num_views: 81
min_num_context_views: 11
max_num_context_views: 21
seed: 0

semantic_channels: 16
semantic_expansion_version: 2
semantic_x0_prediction: true

semantic_ce_weight: 0.1
semantic_ce_sigma_max: 1.0
semantic_ce_latent_frames: 2
semantic_ce_ignore_void: true
semantic_ce_gt_only: true
semantic_ce_class_weights: null
semantic_seg_weight: 0.05
num_semantic_classes: 14
semantic_palette_version: 4

semantic_loss_weight: 2.0
rgb_preservation_weight: 1.0
snr_gamma: 5.0

distill_lora_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors
distill_lora_alpha: 1.0

train_dataset: SpatialVID(split=None, ROOT="/scratch/m000204-pm06b/joana/data/sanpo_v26/combined_train_data_v21", labels_dir="/scratch/m000204-pm06b/joana/data/sanpo_v26/sam3_labels_v21", target_labels_dir="/scratch/m000204-pm06b/joana/data/sanpo_v26/gt_labels_v21", segments_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam2_segments", max_interval=5, height=${height}, width=${width}, num_views=${num_views}, min_num_context_views=${min_num_context_views}, max_num_context_views=${max_num_context_views}, seed=${seed}, static_scene=True)

model_path: /scratch/m000204-pm06b/joana/NeoVerse/models
reconstructor_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/reconstructor.ckpt

pipeline_kwargs:
  novel_view_sampling_trans: [0.01, 0.1]
  novel_view_sampling_max_rot: 0.0
  culling_prob: 0.3
  static_movers: [12, 13]
  kernel_size_range: [11, 51]
  occlusion_thresh: 0.1
  alpha_thresh: 0.5
  color_thresh: [50, 100]
  prompt_drop_prob: 0.1
  mask_drop_prob: 0.2
  condition_drop_prob: 0.05

trainable_models: "dit.patch_embedding.sem,dit.head.head.sem,control_branch.control_patch_embedding.sem,semantic_class_head"

lora_base_model: dit
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_exclude_modules: null
lora_rank: 8

pretrained_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v26_campus/checkpoint-epoch-10.safetensors

learning_rate: 1e-4
num_epochs: 6
batch_size: 1
num_workers: 2
pin_memory: false
gradient_accumulation_steps: 1
output_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v31_movers
remove_prefix_in_ckpt: pipe.

use_gradient_checkpointing: true
use_gradient_checkpointing_offload: true
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0

print_freq: 5
save_freq: 0.5
clip_grad: 1.0
resume: null
start_epoch: 0
resume_step: null

wandb_project: neoverse-semantic
wandb_run_name: v31_movers_from_v26e10
wandb_mode: online

debug_save_root: null
