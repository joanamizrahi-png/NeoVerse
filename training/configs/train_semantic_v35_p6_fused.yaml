# v35_p6_fused (2026-09-20): v33 epoch 9 CONTINUED for 3 epochs with movers FUSED.
# Why: the hint audit (scripts/hint_mover_audit.py on the 09-19 dumps) showed that with
# static_movers [12, 13] (people/vehicles kept per frame) only 21.6% of target person/vehicle
# pixels see the same class in the hint; 71.6% see ground. The model was rewarded for painting
# people onto ground with no hint evidence = the phantom crashes on pavement. With movers fused
# into the static scene the hint agrees with the target on 61.3% of those pixels (void 2.9%).
# Fused is also how the policy runs render at test time (STATICMOVERS off), so v35 trains the
# way it is deployed. Same data (SANPO v26), palette 6, LoRA rank 8, lr 1e-4; only the mover
# handling and the warm start change.

