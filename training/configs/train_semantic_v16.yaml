# v16: same expanded data as v15, two fixes for what v15 got wrong.
#
# v15 measured (2026-08-20): held-out trail-6 80.9% (v10 79.9, HELD) but
# park-1 68.4% (v10 80.6, LOST — vegetation IoU 67 -> 0.2) and SCAND
# predicted 57.6% VOID at 99.9% real geometry (v10 got persons 2.8%, v15 0%).
# Cause: clips without dense GT (GND/SCAND/Go2W) train against SAM3 output,
# whose "unlabeled"->void regions are taught as a real class, and the shifted
# mixture re-broke the park vegetation/grass boundary v10 had fixed.
#
# FIX 1  semantic_ce_ignore_void: void pixels teach nothing (no-op on RUGD,
#        whose dense GT is ~0.1% void; decisive on the pseudo-labelled clips).
# FIX 3  semantic_ce_gt_only: pseudo-labelled clips (GND/SCAND/Go2W) train the
#        diffusion/appearance half only — they never teach class conventions,
#        so "correct the SAM3 hint" (learned from RUGD's dense GT) survives.
#        This is why v15 lost park vegetation: park-1_02 is HELD OUT, so at
#        inference the model only has SAM3's hint, and v15 had been taught on
#        8 clips to reproduce that hint verbatim.
# FIX 2  pretrained_path: warm-start from v10's final checkpoint and fine-tune
#        for 12 epochs instead of re-deriving everything from scratch, so the
#        classes v10 already mastered are preserved.
# Judge vs v10: held-out RUGD must HOLD (79.9/80.6), SCAND void must FALL and
# person recall RISE, GND campus classes must beat v10's.

height: 336
width: 560
num_views: 81
min_num_context_views: 11
max_num_context_views: 21
seed: 0

semantic_channels: 16
semantic_expansion_version: 2
semantic_x0_prediction: true

# --- Change 2 ---
semantic_ce_weight: 0.1        # start ~0.1x the diffusion loss; tune by val mIoU
semantic_ce_sigma_max: 1.0
semantic_ce_latent_frames: 2   # -> 5 decoded video frames per CE step
semantic_ce_ignore_void: true  # FIX 1 (see header)
semantic_ce_gt_only: true      # FIX 3: class losses only where dense human GT exists
semantic_seg_weight: 0.05      # Change 3, no size filter (decision 2026-08-03)
num_semantic_classes: 14

semantic_loss_weight: 2.0
rgb_preservation_weight: 1.0
snr_gamma: 5.0

distill_lora_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors
distill_lora_alpha: 1.0

train_dataset: SpatialVID(split=None, ROOT="/scratch/m000204-pm06b/joana/combined_train_data_v15", labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam3_labels_v14", target_labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/rugd_gt_labels_v14", segments_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam2_segments", max_interval=5, height=${height}, width=${width}, num_views=${num_views}, min_num_context_views=${min_num_context_views}, max_num_context_views=${max_num_context_views}, seed=${seed})

model_path: /scratch/m000204-pm06b/joana/NeoVerse/models
reconstructor_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/reconstructor.ckpt

pipeline_kwargs:
  novel_view_sampling_trans: [0.01, 0.1]
  novel_view_sampling_max_rot: 0.0
  culling_prob: 0.3
  kernel_size_range: [11, 51]
  occlusion_thresh: 0.1
  alpha_thresh: 0.5
  color_thresh: [50, 100]
  prompt_drop_prob: 0.1
  mask_drop_prob: 0.2
  condition_drop_prob: 0.05

# semantic_class_head added: the CE head trains alongside the _sem submodules.
trainable_models: "dit.patch_embedding.sem,dit.head.head.sem,control_branch.control_patch_embedding.sem,semantic_class_head"

lora_base_model: dit
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_exclude_modules: null
lora_rank: 8

pretrained_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v10/checkpoint-epoch-30.safetensors

learning_rate: 1e-4
num_epochs: 12
batch_size: 1
num_workers: 2
pin_memory: false
gradient_accumulation_steps: 1
output_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v16
remove_prefix_in_ckpt: pipe.

use_gradient_checkpointing: true
use_gradient_checkpointing_offload: true
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0

print_freq: 5
save_freq: 0.25
clip_grad: 1.0
resume: null
start_epoch: 0
resume_step: null

wandb_project: neoverse-semantic
wandb_run_name: v16_warmstart_ignorevoid
wandb_mode: online

debug_save_root: null
