# v7: dense GT targets (Option B hybrid) + tamed trunk LoRA. Attacks v6's speckle.
#
# v6 verdict (2026-07-17): architecture works — real regional structure, losses
# dropping (sem 0.867 vs v5's flat ~1.56). Two remaining defects:
#   1. High-frequency MOTTLE in BOTH rgb and semantic -> the shared rank-16
#      trunk LoRA drifted (everything else RGB-touching is frozen).
#      Fix here: lora_rank 16 -> 8. (If still mottled: separate LR groups next.)
#   2. Speckle + void reproduction in semantic -> the Option A ceiling: training
#      target WAS SAM3 pseudo-labels, which are themselves speckled and holey;
#      MSE faithfully learns speckle.
#      Fix here: target_labels_dir points at DENSE RUGD ground-truth masks
#      (prepare_rugd_gt_labels.py). RUGD clips train against flat human labels;
#      the SAM3 labels remain the Gaussian-attached HINT (deploy-consistent);
#      non-RUGD clips (cityscapes) fall back to SAM3 targets (hybrid).
# Also: 30 epochs (more optimization on the stronger flat-target signal).
# PREREQ: run scripts/prepare_rugd_gt_labels.py first so rugd_gt_labels/ exists.

height: 336
width: 560
num_views: 81
min_num_context_views: 11
max_num_context_views: 21
seed: 0

semantic_channels: 16
semantic_expansion_version: 2   # NEW: 1 = v3/4/5 in-place grow, 2 = v6 parallel _sem

# Down from v5's 4.0. RGB anchor (weight 1.0) has more headroom now.
semantic_loss_weight: 2.0

# Merge lightx2v 4-step distill LoRA into the base DiT at pipeline load.
# This is what inference does. Training must match or the finetune learns
# behavior that gets scrambled at 4-step eval.
distill_lora_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/loras/Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors
distill_lora_alpha: 1.0

train_dataset: SpatialVID(split=None, ROOT="/scratch/m000204-pm06b/joana/combined_train_data", labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/sam3_labels", target_labels_dir="/scratch/m000204-pm06b/joana/NeoVerse/outputs/rugd_gt_labels", max_interval=5, height=${height}, width=${width}, num_views=${num_views}, min_num_context_views=${min_num_context_views}, max_num_context_views=${max_num_context_views}, seed=${seed})

model_path: /scratch/m000204-pm06b/joana/NeoVerse/models
reconstructor_path: /scratch/m000204-pm06b/joana/NeoVerse/models/NeoVerse/reconstructor.ckpt

pipeline_kwargs:
  novel_view_sampling_trans: [0.01, 0.1]
  novel_view_sampling_max_rot: 0.0
  culling_prob: 0.3
  kernel_size_range: [11, 51]
  occlusion_thresh: 0.1
  alpha_thresh: 0.5
  color_thresh: [50, 100]
  prompt_drop_prob: 0.1
  mask_drop_prob: 0.2
  condition_drop_prob: 0.05

# Train ONLY the new _sem submodules. All RGB pathways stay bit-identical to
# base pretrained (plus the small attention LoRA below).
trainable_models: "dit.patch_embedding.sem,dit.head.head.sem,control_branch.control_patch_embedding.sem"

# Rank-16 LoRA on attention/FFN gives the semantic pathway a way to ROUTE
# information through the frozen transformer. Starts at zero, so RGB path is
# still preserved at t=0. rgb_loss=1.0 anchors it.
lora_base_model: dit
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_exclude_modules: null
lora_rank: 8

# Fresh start from base pretrained (+ distill merged above). No v3 warm-start:
# v3 has stale-label patterns in control_branch we'd bake in permanently.
pretrained_path: null

learning_rate: 1e-4
num_epochs: 30
batch_size: 1
num_workers: 2
pin_memory: false
gradient_accumulation_steps: 1
output_path: /scratch/m000204-pm06b/joana/runs/train_semantic_v7
remove_prefix_in_ckpt: pipe.

use_gradient_checkpointing: true
use_gradient_checkpointing_offload: true
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0

print_freq: 5
save_freq: 0.25
clip_grad: 1.0
resume: null
start_epoch: 0
resume_step: null

wandb_project: neoverse-semantic
wandb_run_name: v7_gt_targets_rank8
wandb_mode: online

debug_save_root: null
